<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <nav id="nav"></nav>
  <main>
    <form id="form" class="panel auth">
      <h1>Log in</h1>
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <div class="row"><button type="submit">Log in</button></div>
      <p id="msg" class="msg" role="alert"></p>
      <p class="hint">New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
