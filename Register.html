<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
  <nav id="nav"></nav>
  <main>
    <form id="form" class="panel auth">
      <h1>Create your account</h1>
      <label for="name">Full name</label>
      <input id="name" required autocomplete="name">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="new-password">
      <p class="hint">At least 6 characters.</p>
      <div class="row"><button type="submit">Create account</button></div>
      <p id="msg" class="msg" role="alert"></p>
      <p class="hint">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
